; PHP2Shell (CVE-2026-109619) - PHP 8.5 ONLY
; Source: https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
;
; Install ONLY on PHP 8.5 runtimes that are not yet on 8.5.12, e.g.
;   /etc/php/8.5/{fpm,apache2,cgi}/conf.d/99-php2shell-85.ini
; The directive does not exist before PHP 8.5; keep it out of older branches
; so no configuration diagnostic is produced (diagnostics emitted while INI
; settings are applied are themselves a confirmed trigger of CVE-2026-109619).
;
; Blocks the confirmed fatal error backtrace path only (the producer used by
; the confirmed mod_php RCE). Restart every worker afterwards.
; FPM pool equivalent:  php_admin_flag[fatal_error_backtraces] = off
fatal_error_backtraces = 0
